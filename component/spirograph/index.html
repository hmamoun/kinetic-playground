<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spirograph Studio</title>
<style>
  :root {
    color-scheme: light;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  .spiro-shell {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 8px 0 14px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .stage {
    position: relative;
    width: min(100%, var(--canvas-size, 720px));
    aspect-ratio: 1;
    background:
      linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,.25)),
      var(--background, #fffaf0);
    border: 1px solid rgba(28, 37, 65, .14);
    border-radius: 8px;
    box-shadow: 0 18px 46px rgba(22, 31, 56, .16);
    overflow: hidden;
  }

  canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  #spiro-canvas {
    z-index: 1;
  }

  #tool-canvas {
    z-index: 2;
    pointer-events: none;
  }

  .hud {
    position: absolute;
    z-index: 3;
    left: 14px;
    right: 14px;
    bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }

  button,
  .live-color {
    pointer-events: auto;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(25, 34, 58, .18);
    border-radius: 8px;
    background: rgba(255, 255, 255, .82);
    box-shadow: 0 8px 22px rgba(20, 27, 48, .12);
    backdrop-filter: blur(12px);
  }

  button {
    width: 42px;
    color: #172033;
    font-size: 17px;
    cursor: pointer;
  }

  button:hover,
  .live-color:hover {
    background: rgba(255, 255, 255, .95);
  }

  .live-color {
    margin-left: auto;
    gap: 8px;
    padding: 0 8px 0 12px;
    color: #172033;
    font-size: 13px;
    font-weight: 650;
  }

  .live-color input {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="spiro-shell">
    <div class="stage">
      <canvas id="spiro-canvas"></canvas>
      <canvas id="tool-canvas"></canvas>
      <div class="hud">
        <button id="play-pause" type="button" aria-label="Pause drawing" title="Pause drawing">&#10074;&#10074;</button>
        <button id="clear" type="button" aria-label="Clear drawing" title="Clear drawing">&#8634;</button>
        <button id="save-jpg" type="button" aria-label="Save drawing as JPG" title="Save drawing as JPG">JPG</button>
        <label class="live-color" title="Change pen color while drawing">
          <span>Pen</span>
          <input id="live-pen" type="color" />
        </label>
      </div>
    </div>
  </div>

<script>
(() => {
  const stage = document.querySelector(".stage");
  const canvas = document.querySelector("#spiro-canvas");
  const toolCanvas = document.querySelector("#tool-canvas");
  const drawCtx = canvas.getContext("2d");
  const toolCtx = toolCanvas.getContext("2d");
  const playPause = document.querySelector("#play-pause");
  const clearButton = document.querySelector("#clear");
  const saveJpgButton = document.querySelector("#save-jpg");
  const livePen = document.querySelector("#live-pen");

  const TWO_PI = Math.PI * 2;
  const STRUCTURAL_KEYS = [
    "patternType",
    "guideShape",
    "movingShape",
    "outerRadius",
    "innerRadius",
    "penOffset",
    "objectCount",
    "objectScale",
    "attachmentSpread",
    "relationSpeed",
    "attachmentSeed",
  ];

  let config = null;
  let guideShape = "circle";
  let movingShape = "circle";
  let objectCount = 2;
  let attachments = null;
  let livePenTouched = false;

  let running = true;
  let penColor = "#136f63";
  let hue = 0;
  let step = 0;
  let tCursor = 0;
  let previous = null;
  let animationId = null;

  function sendFrameHeight() {
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height }, "*");
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const width = Math.max(260, Math.round(rect.width * dpr));
    const height = Math.max(260, Math.round(rect.height * dpr));

    if (
      canvas.width === width &&
      canvas.height === height &&
      toolCanvas.width === width &&
      toolCanvas.height === height
    ) {
      return;
    }

    let snapshot = null;
    if (canvas.width > 0 && canvas.height > 0) {
      snapshot = document.createElement("canvas");
      snapshot.width = canvas.width;
      snapshot.height = canvas.height;
      snapshot.getContext("2d").drawImage(canvas, 0, 0);
    }

    canvas.width = width;
    canvas.height = height;
    toolCanvas.width = width;
    toolCanvas.height = height;

    drawCtx.setTransform(1, 0, 0, 1, 0, 0);
    drawCtx.fillStyle = config.backgroundColor;
    drawCtx.fillRect(0, 0, width, height);
    if (snapshot) {
      drawCtx.drawImage(snapshot, 0, 0, snapshot.width, snapshot.height, 0, 0, width, height);
    }
    drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    toolCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    clearToolLayer();
    previous = null;
  }

  function clearToolLayer() {
    const size = toolCanvas.getBoundingClientRect().width;
    toolCtx.clearRect(0, 0, size, size);
  }

  function resetDrawing() {
    const size = canvas.getBoundingClientRect().width;
    drawCtx.clearRect(0, 0, size, size);
    drawCtx.fillStyle = config.backgroundColor;
    drawCtx.fillRect(0, 0, size, size);
    clearToolLayer();
    drawTools(0);
    previous = null;
    step = 0;
    tCursor = 0;
  }

  function saveAsJpg() {
    const exportCanvas = document.createElement("canvas");
    exportCanvas.width = canvas.width;
    exportCanvas.height = canvas.height;
    const exportCtx = exportCanvas.getContext("2d");
    exportCtx.fillStyle = config.backgroundColor;
    exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
    exportCtx.drawImage(canvas, 0, 0);

    const link = document.createElement("a");
    link.download = `spirograph-drawing-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.jpg`;
    link.href = exportCanvas.toDataURL("image/jpeg", 0.95);
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function shapeMultiplier(shape, angle) {
    if (shape === "circle") return 1;
    if (shape === "triangle") return 1 + 0.11 * Math.cos(3 * angle);
    if (shape === "square") return 1 + 0.08 * Math.cos(4 * angle + Math.PI / 4);
    if (shape === "pentagon") return 1 + 0.07 * Math.cos(5 * angle);
    if (shape === "star") return 1 + 0.16 * Math.cos(5 * angle);
    if (shape === "flower") return 1 + 0.12 * Math.sin(6 * angle);
    return 1;
  }

  function seededRandom(seed) {
    let value = seed >>> 0;
    return function random() {
      value += 0x6D2B79F5;
      let next = value;
      next = Math.imul(next ^ next >>> 15, next | 1);
      next ^= next + Math.imul(next ^ next >>> 7, next | 61);
      return ((next ^ next >>> 14) >>> 0) / 4294967296;
    };
  }

  function rotorRadius(index) {
    return Math.max(6, config.innerRadius * Math.pow(config.objectScale, index));
  }

  function buildAttachments() {
    const random = seededRandom(config.attachmentSeed);
    const links = [];

    for (let index = 1; index < objectCount; index += 1) {
      const previousRadius = rotorRadius(index - 1);
      const anchorRadius = previousRadius * config.attachmentSpread * (0.25 + random() * 0.74);
      const spinDirection = random() < 0.5 ? -1 : 1;
      links.push({
        anchorAngle: random() * TWO_PI,
        anchorRadius,
        phase: random() * TWO_PI,
        spin: spinDirection * (0.7 + random() * 1.65) * (1 + index * 0.16),
      });
    }

    const lastRadius = rotorRadius(objectCount - 1);
    return {
      links,
      pen: {
        angle: random() * TWO_PI,
        radius: Math.min(config.penOffset, lastRadius * 0.94),
      },
    };
  }

  function firstRotorAt(t) {
    const R = config.outerRadius;
    const r = config.innerRadius;
    const inside = config.patternType === "inside";
    const guideWarp = shapeMultiplier(guideShape, t);
    const movingWarp = shapeMultiplier(movingShape, -t * R / Math.max(1, r));
    const outer = R * guideWarp;
    const inner = r * movingWarp;
    const ratio = inside ? (outer - inner) / inner : (outer + inner) / inner;
    const base = inside ? outer - inner : outer + inner;

    return {
      x: base * Math.cos(t),
      y: base * Math.sin(t),
      radius: Math.max(8, inner),
      angle: inside ? Math.PI + ratio * t : -ratio * t,
      shape: movingShape,
    };
  }

  function chainState(t) {
    const nodes = [firstRotorAt(t)];

    for (let index = 1; index < objectCount; index += 1) {
      const previousNode = nodes[index - 1];
      const link = attachments.links[index - 1];
      const anchorAngle = previousNode.angle + link.anchorAngle;
      const x = previousNode.x + Math.cos(anchorAngle) * link.anchorRadius;
      const y = previousNode.y + Math.sin(anchorAngle) * link.anchorRadius;
      const radius = rotorRadius(index);

      nodes.push({
        x,
        y,
        radius,
        angle: previousNode.angle + link.phase + link.spin * config.relationSpeed * t,
        shape: movingShape,
        anchorX: previousNode.x,
        anchorY: previousNode.y,
      });
    }

    const last = nodes[nodes.length - 1];
    const penAngle = last.angle + attachments.pen.angle;
    const tip = {
      x: last.x + Math.cos(penAngle) * attachments.pen.radius,
      y: last.y + Math.sin(penAngle) * attachments.pen.radius,
    };

    return { nodes, tip };
  }

  function pointAt(t) {
    const state = chainState(t);
    const first = state.nodes[0];

    return {
      x: state.tip.x,
      y: state.tip.y,
      rollingX: first.x,
      rollingY: first.y,
      rollingRadius: first.radius,
      nodes: state.nodes,
    };
  }

  function colorForStep(advance = true) {
    if (config.colorMode === "rainbow") {
      if (advance) hue = (hue + config.rainbowSpeed) % 360;
      return `hsl(${hue}, 84%, 52%)`;
    }
    if (config.colorMode === "pulse") {
      const light = 42 + Math.sin(step * 0.04) * 16;
      return `hsl(${config.startHue}, 78%, ${light}%)`;
    }
    return penColor;
  }

  function drawPolygon(ctx, cx, cy, radius, sides, rotation, strokeStyle, fillStyle) {
    ctx.beginPath();
    for (let i = 0; i <= sides; i += 1) {
      const angle = rotation + (i / sides) * TWO_PI;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = 1.5;
    ctx.fill();
    ctx.stroke();
  }

  function drawGear(ctx, cx, cy, radius, rotation, internal, strokeStyle, fillStyle) {
    const teeth = Math.max(8, Math.round((TWO_PI * radius) / 13));
    const depth = Math.min(20, Math.max(3, radius * 0.18));
    const dir = internal ? -1 : 1;
    const segmentsPerTooth = 12;
    const totalSegments = teeth * segmentsPerTooth;

    ctx.beginPath();
    for (let i = 0; i <= totalSegments; i += 1) {
      const angle = (i / totalSegments) * TWO_PI;
      const local = (angle - rotation) * teeth;
      const wave = Math.sign(Math.cos(local)) * Math.pow(Math.abs(Math.cos(local)), 0.35);
      const r = radius + dir * (depth / 2) * wave;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = 1.5;
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(2, radius - dir * depth * 1.1), 0, TWO_PI);
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = 1;
    ctx.globalAlpha *= 0.7;
    ctx.stroke();
    ctx.globalAlpha /= 0.7;
  }

  function drawShapeOutline(ctx, cx, cy, radius, shape, rotation, strokeStyle, fillStyle, gearInfo) {
    if (shape === "circle") {
      if (gearInfo) {
        drawGear(ctx, cx, cy, radius, rotation, gearInfo.internal, strokeStyle, fillStyle);
        return;
      }
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TWO_PI);
      ctx.fillStyle = fillStyle;
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = 1.5;
      ctx.fill();
      ctx.stroke();
      return;
    }

    if (shape === "triangle") return drawPolygon(ctx, cx, cy, radius, 3, rotation - Math.PI / 2, strokeStyle, fillStyle);
    if (shape === "square") return drawPolygon(ctx, cx, cy, radius, 4, rotation + Math.PI / 4, strokeStyle, fillStyle);
    if (shape === "pentagon") return drawPolygon(ctx, cx, cy, radius, 5, rotation - Math.PI / 2, strokeStyle, fillStyle);

    ctx.beginPath();
    const points = shape === "star" ? 10 : 180;
    for (let i = 0; i <= points; i += 1) {
      const a = rotation + (i / points) * TWO_PI;
      const wave = shape === "star"
        ? (i % 2 === 0 ? 1 : 0.56)
        : 1 + 0.12 * Math.sin(6 * a);
      const x = cx + Math.cos(a) * radius * wave;
      const y = cy + Math.sin(a) * radius * wave;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = 1.5;
    ctx.fill();
    ctx.stroke();
  }

  function drawTools(t) {
    if (!config.showTools) return;

    clearToolLayer();
    const size = toolCanvas.getBoundingClientRect().width;
    const center = size / 2;
    const scale = config.scale;
    const state = chainState(t);
    const nodes = state.nodes;

    toolCtx.save();
    toolCtx.translate(center, center);
    toolCtx.globalAlpha = 0.9;
    drawShapeOutline(
      toolCtx,
      0,
      0,
      config.outerRadius * scale,
      guideShape,
      0,
      "rgba(23, 32, 51, .32)",
      "rgba(255, 255, 255, .16)",
      { internal: config.patternType === "inside" }
    );

    toolCtx.beginPath();
    for (let index = 1; index < nodes.length; index += 1) {
      const previousNode = nodes[index - 1];
      const node = nodes[index];
      toolCtx.moveTo(previousNode.x * scale, previousNode.y * scale);
      toolCtx.lineTo(node.x * scale, node.y * scale);
    }
    toolCtx.strokeStyle = "rgba(23, 32, 51, .28)";
    toolCtx.lineWidth = 1.4;
    toolCtx.stroke();

    nodes.forEach((node, index) => {
      drawShapeOutline(
        toolCtx,
        node.x * scale,
        node.y * scale,
        node.radius * scale,
        node.shape,
        node.angle,
        index === 0 ? "rgba(23, 32, 51, .46)" : "rgba(23, 32, 51, .38)",
        index === nodes.length - 1 ? "rgba(255, 255, 255, .36)" : "rgba(255, 255, 255, .24)",
        { internal: false }
      );

      toolCtx.beginPath();
      toolCtx.arc(node.x * scale, node.y * scale, Math.max(2.5, config.lineWidth + 1), 0, TWO_PI);
      toolCtx.fillStyle = "rgba(23, 32, 51, .36)";
      toolCtx.fill();
    });

    const lastNode = nodes[nodes.length - 1];
    toolCtx.beginPath();
    toolCtx.moveTo(lastNode.x * scale, lastNode.y * scale);
    toolCtx.lineTo(state.tip.x * scale, state.tip.y * scale);
    toolCtx.strokeStyle = "rgba(23, 32, 51, .5)";
    toolCtx.lineWidth = 1.4;
    toolCtx.stroke();

    toolCtx.beginPath();
    toolCtx.arc(state.tip.x * scale, state.tip.y * scale, Math.max(3, config.lineWidth + 2), 0, TWO_PI);
    toolCtx.fillStyle = colorForStep(false);
    toolCtx.fill();
    toolCtx.restore();
  }

  function drawFrame() {
    if (running) {
      const size = canvas.getBoundingClientRect().width;
      const center = size / 2;
      const scale = config.scale;

      const segmentCount = Math.max(1, config.samplesPerFrame);
      const segmentStep = config.frameAdvance / segmentCount;

      for (let i = 0; i < segmentCount; i += 1) {
        const t = tCursor;
        const p = pointAt(t);
        const next = {
          x: center + p.x * scale,
          y: center + p.y * scale,
        };

        if (previous) {
          drawCtx.beginPath();
          drawCtx.moveTo(previous.x, previous.y);
          drawCtx.lineTo(next.x, next.y);
          drawCtx.strokeStyle = colorForStep();
          drawCtx.lineWidth = config.lineWidth;
          drawCtx.lineCap = "round";
          drawCtx.lineJoin = "round";
          drawCtx.globalAlpha = config.penOpacity;
          drawCtx.stroke();
          drawCtx.globalAlpha = 1;
        }

        previous = next;
        step += 1;
        tCursor += segmentStep;
        if (tCursor >= config.maxAngle) {
          if (config.loopDrawing) resetDrawing();
          else running = false;
        }
      }

      if (config.showTools) drawTools(tCursor);
    }

    playPause.innerHTML = running ? "&#10074;&#10074;" : "&#9654;";
    playPause.setAttribute("aria-label", running ? "Pause drawing" : "Resume drawing");
    animationId = requestAnimationFrame(drawFrame);
  }

  function applyConfig(newConfig) {
    const prev = config;
    const structuralChanged = !prev || STRUCTURAL_KEYS.some((key) => prev[key] !== newConfig[key]);
    const sizeChanged = !prev || prev.canvasSize !== newConfig.canvasSize;

    config = newConfig;
    guideShape = config.guideShape;
    movingShape = config.movingShape;
    objectCount = Math.max(2, config.objectCount);

    stage.style.setProperty("--canvas-size", `${config.canvasSize}px`);
    stage.style.setProperty("--background", config.backgroundColor);

    if (!livePenTouched) {
      penColor = config.penColor;
      livePen.value = config.penColor;
    }

    if (!prev) {
      hue = config.startHue;
    }

    if (structuralChanged) {
      attachments = buildAttachments();
    }

    if (sizeChanged) {
      resizeCanvas();
    }

    if (!prev) {
      drawFrame();
    }

    sendFrameHeight();
  }

  playPause.addEventListener("click", () => {
    running = !running;
  });

  clearButton.addEventListener("click", () => {
    resetDrawing();
    running = true;
  });

  saveJpgButton.addEventListener("click", saveAsJpg);

  livePen.addEventListener("input", (event) => {
    livePenTouched = true;
    penColor = event.target.value;
  });

  window.addEventListener("resize", () => {
    resizeCanvas();
    sendFrameHeight();
  });

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    applyConfig(data.args.config);
  });

  window.addEventListener("pagehide", () => {
    if (animationId) cancelAnimationFrame(animationId);
  });

  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
})();
</script>
</body>
</html>
